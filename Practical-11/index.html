<!-- PRACTICAL 11: CONTACT SECTION -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 11 - Contact Section</title><link rel="stylesheet" href="style.css"></head>
<body>
    <header class="header"><h1>Contact Us</h1><p>We'd love to hear from you</p></header>
    <section class="contact-wrapper">
        <article class="contact-info">
            <h2>Get in Touch</h2>
            <div class="info-items">
                <div class="info-item"><h3>📍 Address</h3><p>123 Main St, City, Country 12345</p></div>
                <div class="info-item"><h3>📞 Phone</h3><p>+1 (555) 123-4567</p></div>
                <div class="info-item"><h3>✉️ Email</h3><p>info@company.com</p></div>
                <div class="info-item"><h3>🕐 Hours</h3><p>Mon-Fri: 9AM-6PM EST</p></div>
            </div>
        </article>
        <form class="contact-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" placeholder="How can we help?" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea placeholder="Your message here..." rows="5" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </section>
    <footer class="footer"><p>&copy; 2024 | Practical 11: Contact Section</p></footer>
</body>
</html>
