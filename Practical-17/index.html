<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 17 - Table Design</title><link rel="stylesheet" href="style.css">    <link rel="stylesheet" href="../code-viewer.css" data-code-viewer-asset>
</head>
<body>
    <header class="header"><h1>Sales Report</h1></header>
    <section class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr><th>Product</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Total</th></tr>
            </thead>
            <tbody>
                <tr><td>Laptops</td><td>$24,500</td><td>$28,900</td><td>$32,100</td><td>$85,500</td></tr>
                <tr><td>Phones</td><td>$18,200</td><td>$21,400</td><td>$25,600</td><td>$65,200</td></tr>
                <tr><td>Tablets</td><td>$12,300</td><td>$14,800</td><td>$17,900</td><td>$45,000</td></tr>
                <tr><td>Accessories</td><td>$8,900</td><td>$10,200</td><td>$12,400</td><td>$31,500</td></tr>
                <tr><td>Software</td><td>$15,600</td><td>$18,300</td><td>$21,100</td><td>$55,000</td></tr>
            </tbody>
        </table>
    </section>
    <footer class="footer"><p>&copy; 2024 | Practical 17: Table Design</p></footer><template data-code-source="css" hidden>
/* PRACTICAL 17: TABLE DESIGN */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f5f5f5}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:50px 20px;text-align:center}
.header h1{font-size:2.5rem}
.table-wrapper{max-width:900px;margin:50px auto;padding:0 20px;background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.data-table{width:100%;border-collapse:collapse}
.data-table thead{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white}
.data-table th{padding:15px;text-align:left;font-weight:700}
.data-table td{padding:15px;border-bottom:1px solid #e0e0e0}
.data-table tbody tr{transition:0.3s}
.data-table tbody tr:hover{background:#f9f9f9}
.data-table tbody tr:nth-child(even){background:#f5f5f5}
.footer{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:30px 20px;text-align:center;margin-top:40px}
@media(max-width:480px){.table-wrapper{margin:20px auto}.data-table th,.data-table td{padding:10px;font-size:0.9rem}}

</template>

    <script src="../code-viewer.js" data-code-viewer-asset defer></script>
</body>
</html>
