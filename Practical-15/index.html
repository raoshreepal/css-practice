/* PRACTICAL 15: SIDEBAR */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;display:flex;height:100vh}
.sidebar{width:250px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:20px 0;position:fixed;height:100vh;overflow-y:auto}
.sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,0.2);margin-bottom:20px}
.sidebar-header h2{font-size:1.5rem}
.nav-list{list-style:none}
.nav-link{display:block;padding:15px 20px;color:white;text-decoration:none;transition:0.3s;border-left:3px solid transparent}
.nav-link:hover{background:rgba(255,255,255,0.1);border-left-color:white}
.nav-link.active{background:rgba(255,255,255,0.2);border-left-color:white}
.main-content{margin-left:250px;flex:1;display:flex;flex-direction:column}
.top-bar{background:white;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.top-bar h1{color:#333;font-size:2rem}
.content{flex:1;padding:30px;background:#f5f5f5;overflow-y:auto}
.content p{color:#666;font-size:1.1rem;line-height:1.6}
.footer{background:#333;color:white;padding:20px;text-align:center;margin-left:250px}
@media(max-width:768px){.sidebar{width:200px}.main-content,.footer{margin-left:200px}}
@media(max-width:480px){.sidebar{width:100%;height:auto;position:relative;padding:10px 0}.main-content,.footer{margin-left:0}.sidebar-header{padding:10px}.nav-link{padding:10px 15px}.top-bar{padding:15px}.content{padding:15px}}

</template>

    <script src="../code-viewer.js" data-code-viewer-asset defer></script>
</body>
</html>
