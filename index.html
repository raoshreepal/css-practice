            const card = document.createElement('div');
            card.className = `practical-card ${practical.difficulty}`;
            card.setAttribute('data-difficulty', practical.difficulty);
            
            card.innerHTML = `
                <div class="card-header">
                    <span class="practical-number">Practical ${practical.id}</span>
                    <span class="difficulty-badge">${practical.difficulty.toUpperCase()}</span>
                </div>
                <div class="card-content">
                    <h3>${practical.name}</h3>
                    <p class="description">${practical.description}</p>
                    <div class="topics">
                        <strong>Topics:</strong> ${practical.topics}
                    </div>
                </div>
                <div class="card-footer">
                    <button class="view-btn" onclick="openPractical('${practical.path}')">
                        Open Practical ->
                    </button>
                </div>
            `;
            
            return card;
        }

        // Populate grids on page load
        function populateGrids() {
            const beginnerGrid = document.getElementById('beginner-grid');
            const intermediateGrid = document.getElementById('intermediate-grid');
            const advancedGrid = document.getElementById('advanced-grid');

            practicals.forEach(practical => {
                const card = createPracticalCard(practical);
                
                if (practical.difficulty === 'beginner') {
                    beginnerGrid.appendChild(card);
                } else if (practical.difficulty === 'intermediate') {
                    intermediateGrid.appendChild(card);
                } else if (practical.difficulty === 'advanced') {
                    advancedGrid.appendChild(card);
                }
            });
        }

        // Filter practicals
        function filterPracticals(difficulty) {
            const cards = document.querySelectorAll('.practical-card');
            const buttons = document.querySelectorAll('.nav-btn');

            // Update active button
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-filter') === difficulty) {
                    btn.classList.add('active');
                }
            });

            // Show/hide cards
            cards.forEach(card => {
                const cardDifficulty = card.getAttribute('data-difficulty');
                
                if (difficulty === 'all' || cardDifficulty === difficulty) {
                    card.style.display = 'block';
                    setTimeout(() => {
                        card.classList.add('visible');
                    }, 10);
                } else {
                    card.classList.remove('visible');
                    setTimeout(() => {
                        card.style.display = 'none';
                    }, 300);
                }
            });

            // Show/hide sections
            const sections = document.querySelectorAll('.practicals-section');
            sections.forEach(section => {
                const visibleCards = section.querySelectorAll('.practical-card[style*="display: block"]');
                section.style.display = visibleCards.length > 0 ? 'block' : 'none';
            });
        }

        // Open practical in new tab
        function openPractical(path) {
            const fullPath = window.location.pathname.includes('index.html') 
                ? window.location.pathname.replace('index.html', '') + path
                : window.location.pathname + path;
            
            window.open(path, '_blank');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            populateGrids();
            
            // Add filter button listeners
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const filter = this.getAttribute('data-filter');
                    filterPracticals(filter);
                });
            });

            // Set "All" as active by default
            document.querySelector('[data-filter="all"]').classList.add('active');

            // Add scroll animation for cards

                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.practical-card').forEach(card => {
                observer.observe(card);
            });
        });

/* ============================================
   MAIN CSS - CSS PRACTICAL HANDBOOK LANDING PAGE
   ============================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    overflow-x: hidden;
}

/* ============================================
   HEADER STYLES
   ============================================ */

.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 40px 20px;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    animation: slideDown 0.6s ease-out;
}

@keyframes slideDown {
    from {
        transform: translateY(-100%);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.header-content {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
}

.logo h1 {
    font-size: 2rem;
    margin-bottom: 8px;
    animation: fadeInUp 0.8s ease-out;
}

.logo p {
    font-size: 1.1rem;
    opacity: 0.9;
    animation: fadeInUp 0.8s ease-out 0.1s both;
}

@keyframes fadeInUp {
    from {
        transform: translateY(20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* ============================================
   NAVIGATION MENU
   ============================================ */

.nav-menu {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.nav-btn {
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.3);
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    animation: fadeInDown 0.8s ease-out 0.2s both;
}

@keyframes fadeInDown {
    from {
        transform: translateY(-20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.nav-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.5);
}

.nav-btn.active {
    background: white;
    color: #667eea;
    border-color: white;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

/* ============================================
   MAIN CONTENT
   ============================================ */

.main-content {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 20px;
}

.practicals-section {
    margin-bottom: 60px;
    animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.section-title {
    font-size: 2rem;
    color: white;
    margin-bottom: 30px;
    text-align: center;
    animation: slideInLeft 0.8s ease-out;
}

@keyframes slideInLeft {
    from {
        transform: translateX(-30px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

/* ============================================
   PRACTICALS GRID
   ============================================ */

.practicals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 25px;
    margin-bottom: 30px;
}

/* ============================================
   PRACTICAL CARD STYLES
   ============================================ */

.practical-card {
    background: white;
    border-radius: 15px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform: translateY(30px);
    opacity: 0;
    cursor: pointer;
    border-top: 4px solid;
    display: none;
}

.practical-card.beginner {
    border-top-color: #4CAF50;
}

.practical-card.intermediate {
    border-top-color: #FF9800;
}

.practical-card.advanced {
    border-top-color: #F44336;
}

.practical-card.visible {
    display: block;
    transform: translateY(0);
    opacity: 1;
    animation: scaleIn 0.5s ease-out;
}

@keyframes scaleIn {
    from {
        transform: scale(0.95) translateY(30px);
        opacity: 0;
    }
    to {
        transform: scale(1) translateY(0);
        opacity: 1;
    }
}

.practical-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
}

/* ============================================
   CARD HEADER
   ============================================ */

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
}

.practical-number {
    font-weight: 700;
    color: #667eea;
    font-size: 0.9rem;
}

.difficulty-badge {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.beginner .difficulty-badge {
    background: #E8F5E9;
    color: #2E7D32;
}

.intermediate .difficulty-badge {
    background: #FFF3E0;
    color: #E65100;
}

.advanced .difficulty-badge {
    background: #FFEBEE;
    color: #C62828;
}

/* ============================================
   CARD CONTENT
   ============================================ */

.card-content {
    padding: 20px;
}

.card-content h3 {
    font-size: 1.3rem;
    color: #333;
    margin-bottom: 12px;
    font-weight: 700;
}

.description {
    color: #666;
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 15px;
}

.topics {
    font-size: 0.85rem;
    color: #888;
    padding: 12px;
    background: #f5f5f5;
    border-radius: 8px;
    border-left: 3px solid #667eea;
}

.topics strong {
    color: #667eea;
}

/* ============================================
   CARD FOOTER
   ============================================ */

.card-footer {
    padding: 15px 20px;
    border-top: 1px solid #e0e0e0;
    text-align: center;
}

.view-btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.95rem;
}

.view-btn:hover {
    transform: translateX(5px);
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

.view-btn:active {
    transform: scale(0.98);
}

/* ============================================
   FOOTER
   ============================================ */

.footer {
    background: rgba(0, 0, 0, 0.3);
    color: white;
    padding: 30px 20px;
    text-align: center;
    margin-top: 40px;
    backdrop-filter: blur(10px);
    animation: slideUp 0.8s ease-out;
}

@keyframes slideUp {
    from {
        transform: translateY(30px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.footer p {
    margin: 8px 0;

}

.footer p:first-child {

    font-size: 1rem;
