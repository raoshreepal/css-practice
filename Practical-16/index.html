<!-- PRACTICAL 16: DASHBOARD CARD -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 16 - Dashboard Cards</title><link rel="stylesheet" href="style.css"></head>
<body>
    <header class="header"><h1>Dashboard Metrics</h1></header>
    <section class="dashboard">
        <div class="card"><div class="card-icon">📈</div><h3>Revenue</h3><p class="card-value">$125,430</p><p class="card-change">↑ 12% this month</p></div>
        <div class="card"><div class="card-icon">👥</div><h3>Users</h3><p class="card-value">8,246</p><p class="card-change">↑ 8.5% this month</p></div>
        <div class="card"><div class="card-icon">🎯</div><h3>Conversions</h3><p class="card-value">2,452</p><p class="card-change">↑ 5.2% this month</p></div>
        <div class="card"><div class="card-icon">⏱️</div><h3>Avg Time</h3><p class="card-value">5m 32s</p><p class="card-change">↓ 2.1% this month</p></div>
    </section>
    <footer class="footer"><p>&copy; 2024 | Practical 16: Dashboard Cards</p></footer>
</body>
</html>
