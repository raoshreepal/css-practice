/* PRACTICAL 16: DASHBOARD CARD */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f5f5f5}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:50px 20px;text-align:center}
.header h1{font-size:2.5rem}
.dashboard{max-width:1200px;margin:50px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);transition:all 0.3s;border-top:4px solid #667eea}
.card:hover{transform:translateY(-8px);box-shadow:0 8px 25px rgba(0,0,0,0.15)}
.card-icon{font-size:2.5rem;margin-bottom:15px}
.card h3{color:#333;margin-bottom:15px;font-size:1.1rem}
.card-value{font-size:1.8rem;font-weight:700;color:#667eea;margin-bottom:8px}
.card-change{font-size:0.9rem;color:#999}
.footer{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:30px 20px;text-align:center;margin-top:50px}
@media(max-width:480px){.dashboard{grid-template-columns:1fr}.header{padding:30px 15px}}

</template>

    <script src="../code-viewer.js" data-code-viewer-asset defer></script>
