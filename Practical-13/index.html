<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <header class="header"><h1>Photo Gallery</h1></header>
    <section class="gallery">
        <div class="gallery-item"><div class="image">Photo</div><h3>Landscape</h3></div>
        <div class="gallery-item"><div class="image">Sunset</div><h3>Sunset</h3></div>
        <div class="gallery-item"><div class="image">Peaks</div><h3>Mountains</h3></div>
        <div class="gallery-item"><div class="image">Ocean</div><h3>Ocean</h3></div>
        <div class="gallery-item"><div class="image">City</div><h3>City</h3></div>
        <div class="gallery-item"><div class="image">Forest</div><h3>Forest</h3></div>
    </section>
    <footer class="footer"><p>&copy; 2024 | Practical 13: Gallery</p></footer><template data-code-source="css" hidden>
/* PRACTICAL 13: GALLERY */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#f5f5f5}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:50px 20px;text-align:center;margin-bottom:50px}
.header h1{font-size:2.5rem}
.gallery{max-width:1200px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:50px}
.gallery-item{background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.1);transition:all 0.3s;cursor:pointer}
.gallery-item:hover{transform:scale(1.05);box-shadow:0 8px 25px rgba(0,0,0,0.15)}
.image{width:100%;height:200px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;justify-content:center;align-items:center;font-size:4rem}
.gallery-item h3{color:#333;padding:15px;text-align:center;font-weight:600}
.footer{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:30px 20px;text-align:center;margin-top:40px}
@media(max-width:480px){.gallery{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}

</template>

    <script src="../code-viewer.js" data-code-viewer-asset defer></script>
</body>
</html>
